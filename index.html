<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Financeiro Pro</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f4f6;
 color:#111827
}

header{
 background:#111827;
 color:#fff;
 padding:18px;
 position:sticky;
 top:0;
 z-index:10
}

header h1{
 margin:0 0 5px;
 font-size:22px
}

header small{
 opacity:.8
}

nav{
 display:flex;
 overflow-x:auto;
 gap:6px;
 background:#1f2937;
 padding:8px;
 position:sticky;
 top:72px;
 z-index:9
}

nav button{
 border:0;
 border-radius:8px;
 padding:10px 14px;
 background:#374151;
 color:#fff;
 white-space:nowrap
}

nav button.ativo{
 background:#2563eb
}

main{
 max-width:1100px;
 margin:auto;
 padding:15px
}

.aba{
 display:none
}

.aba.ativa{
 display:block
}

.card,.form,.item{
 background:#fff;
 border-radius:12px;
 padding:14px;
 margin-bottom:12px;
 box-shadow:0 2px 8px #00000012
}

.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px;
 margin-bottom:15px
}

.card small{
 display:block;
 color:#6b7280;
 margin-bottom:6px
}

.card strong{
 font-size:20px
}

.form-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:10px
}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-bottom:4px
}

input,select{
 width:100%;
 padding:10px;
 border:1px solid #d1d5db;
 border-radius:8px;
 background:#fff;
 font-size:15px
}

button{
 border:0;
 border-radius:8px;
 padding:9px 12px;
 background:#2563eb;
 color:#fff;
 cursor:pointer;
 margin:3px
}

button.sec{
 background:#6b7280
}

button.danger{
 background:#dc2626
}

button.ok{
 background:#16a34a
}

h2{
 margin-top:5px
}

.item{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center
}

.receita{
 color:#16a34a
}

.despesa{
 color:#dc2626
}

.tag{
 display:inline-block;
 background:#e5e7eb;
 color:#374151;
 border-radius:6px;
 padding:3px 6px;
 font-size:11px;
 margin-left:4px
}

.muted{
 color:#6b7280
}

.vazio{
 color:#6b7280;
 text-align:center;
 padding:20px
}

@media(max-width:600px){
 .item{
  flex-direction:column;
  align-items:stretch
 }

 .item>div:last-child{
  text-align:left!important
 }
}
</style>
</head>

<body>

<header>
 <h1>Meu Financeiro Pro</h1>
 <small>Controle pessoal + Uber/99</small>
</header>

<nav>
 <button onclick="aba('dashboard')" id="btn-dashboard">Dashboard</button>
 <button onclick="aba('pessoal')" id="btn-pessoal">Pessoal</button>
 <button onclick="aba('saldos')" id="btn-saldos">Saldos</button>
 <button onclick="aba('cartao')" id="btn-cartao">Cartão</button>
 <button onclick="aba('uber')" id="btn-uber">Uber/99</button>
 <button onclick="aba('relatorios')" id="btn-relatorios">Relatórios</button>
</nav>

<main>

<section id="dashboard" class="aba ativa">
 <h2>Dashboard</h2>

 <div class="cards">
  <div class="card">
   <small>Ganhos hoje</small>
   <strong id="dGanhos">R$ 0,00</strong>
  </div>

  <div class="card">
   <small>Despesas hoje</small>
   <strong id="dDespesas">R$ 0,00</strong>
  </div>

  <div class="card">
   <small>Lucro hoje</small>
   <strong id="dLucro">R$ 0,00</strong>
  </div>

  <div class="card">
   <small>Reserva 10%</small>
   <strong id="dReserva">R$ 0,00</strong>
  </div>
 </div>

 <div class="card">
  <h3>Resumo</h3>
  <div id="dashboardResumo"></div>
 </div>
</section>

<section id="pessoal" class="aba">

 <h2>Lançamentos pessoais</h2>

 <div class="form">

  <div class="form-grid">

   <div>
    <label>Data</label>
    <input type="date" id="pData">
   </div>

   <div>
    <label>Descrição</label>
    <input type="text" id="pDesc" placeholder="Ex.: aluguel">
   </div>

   <div>
    <label>Valor</label>
    <input type="number" step="0.01" id="pValor" placeholder="0,00">
   </div>

   <div>
    <label>Tipo</label>
    <select id="pTipo">
     <option value="despesa">Despesa</option>
     <option value="receita">Receita</option>
    </select>
   </div>

   <div>
    <label>Categoria</label>
    <select id="pCat">
     <option value="Despesas">Despesas</option>
     <option value="Despesa fixa">Despesa fixa</option>
     <option value="Alimentação">Alimentação</option>
     <option value="Combustível">Combustível</option>
     <option value="Manutenção">Manutenção</option>
     <option value="Lavagem do carro">Lavagem do carro</option>
     <option value="Empréstimo">Empréstimo</option>
     <option value="Moradia">Moradia</option>
     <option value="Saúde">Saúde</option>
     <option value="Transporte">Transporte</option>
     <option value="Compras">Compras</option>
     <option value="Outros">Outros</option>
    </select>
   </div>

   <div>
    <label>Pagamento</label>
    <select id="pPag">
     <option value="pix">PIX</option>
     <option value="dinheiro">Dinheiro</option>
     <option value="cartao">Cartão</option>
    </select>
   </div>

   <div>
    <label>Status</label>
    <select id="pStatus">
     <option value="pago">Pago</option>
     <option value="pendente">Pendente</option>
    </select>
   </div>

   <div>
    <label>Repetição</label>
    <select id="pRep">
     <option value="unica">Única</option>
     <option value="diaria">Diária</option>
     <option value="semanal">Semanal</option>
     <option value="mensal">Mensal</option>
    </select>
   </div>

   <div>
    <label>Despesa fixa?</label>
    <select id="pFixa">
     <option value="nao">Não</option>
     <option value="sim">Sim</option>
    </select>
   </div>

  </div>

  <button onclick="addPessoal()">Adicionar lançamento</button>

 </div>

 <h3>Lançamentos</h3>
 <div id="listaPessoal"></div>

 <h3>Despesas fixas</h3>
 <div id="listaFixas"></div>

</section>

<section id="saldos" class="aba">
 <h2>Saldos</h2>
 <div id="listaSaldos"></div>
</section>

<section id="cartao" class="aba">

 <h2>Cartão de crédito</h2>

 <div class="form">
  <div class="form-grid">

   <div>
    <label>Dia do fechamento</label>
    <input type="number" id="fechamento" min="1" max="31">
   </div>

   <div>
    <label>Dia do vencimento</label>
    <input type="number" id="vencimento" min="1" max="31">
   </div>

  </div>

  <button onclick="salvarConfigCartao()">Salvar configuração</button>
 </div>

 <div id="listaCartao"></div>

</section>

<section id="uber" class="aba">

 <h2>Uber / 99</h2>

 <div class="form">

  <div class="form-grid">

   <div>
    <label>Data</label>
    <input type="date" id="uData">
   </div>

   <div>
    <label>Ganhos</label>
    <input type="number" step="0.01" id="uGanho">
   </div>

   <div>
    <label>Despesas</label>
    <input type="number" step="0.01" id="uDespesa">
   </div>

   <div>
    <label>Combustível</label>
    <input type="number" step="0.01" id="uCombustivel">
   </div>

   <div>
    <label>KM</label>
    <input type="number" step="0.1" id="uKm">
   </div>

   <div>
    <label>Horas</label>
    <input type="number" step="0.1" id="uHoras">
   </div>

   <div>
    <label>Categoria</label>
    <select id="uCat">
     <option value="Uber/99">Uber/99</option>
     <option value="Combustível">Combustível</option>
     <option value="Manutenção">Manutenção</option>
     <option value="Lavagem do carro">Lavagem do carro</option>
     <option value="Alimentação">Alimentação</option>
     <option value="Empréstimo">Empréstimo</option>
     <option value="Outros">Outros</option>
    </select>
   </div>

  </div>

  <button onclick="addUber()">Adicionar dia</button>

 </div>

 <div id="listaUber"></div>

</section>

<section id="relatorios" class="aba">

 <h2>Relatório mensal</h2>
 <div id="relatorio"></div>

</section>

</main>

<script>
const CHAVE='MF';

let db={
 l:[],
 u:[],
 c:[],
 config:{
  fechamento:5,
  vencimento:10
 }
};

function hoje(){
 return new Date().toISOString().slice(0,10);
}

function carregar(){
 try{
  const salvo=localStorage.getItem(CHAVE);

  if(salvo){
   const dados=JSON.parse(salvo);

   if(dados && typeof dados==='object'){
    db=dados;
   }
  }
 }catch(e){
  console.error('Erro ao carregar dados:',e);
 }

 if(!Array.isArray(db.l))db.l=[];
 if(!Array.isArray(db.u))db.u=[];
 if(!Array.isArray(db.c))db.c=[];
 if(!db.config)db.config={};
}

function salvar(){
 try{
  localStorage.setItem(CHAVE,JSON.stringify(db));
 }catch(e){
  console.error('Erro ao salvar:',e);
  alert('Não foi possível salvar os dados.');
 }
}

function aba(nome){
 document.querySelectorAll('.aba').forEach(x=>{
  x.classList.remove('ativa');
 });

 document.querySelectorAll('nav button').forEach(x=>{
  x.classList.remove('ativo');
 });

 const sec=document.getElementById(nome);
 const btn=document.getElementById('btn-'+nome);

 if(sec)sec.classList.add('ativa');
 if(btn)btn.classList.add('ativo');
}
 function normalizarDados(){

 if(!Array.isArray(db.l))db.l=[];
 if(!Array.isArray(db.u))db.u=[];
 if(!Array.isArray(db.c))db.c=[];
 if(!db.config)db.config={};

 if(!db.config.fechamento)db.config.fechamento=5;
 if(!db.config.vencimento)db.config.vencimento=10;

 db.l.forEach(x=>{

  if(!x.id)x.id=Date.now()+Math.random();

  if(!x.d){
   x.d=x.data||hoje();
  }

  if(!x.desc){
   x.desc=x.descricao||x.description||'Sem descrição';
  }

  if(x.v===undefined||x.v===null){
   x.v=Number(x.valor||0);
  }

  if(!x.tipo){
   x.tipo='despesa';
  }

  if(!x.cat){
   x.cat=x.categoria||x.category||'Despesas';
  }

  if(!x.pag){
   const p=x.pagamento||x.formaPagamento||'dinheiro';

   if(p==='PIX'||p==='Pix')x.pag='pix';
   else if(p==='Cartão'||p==='cartao')x.pag='cartao';
   else x.pag='dinheiro';
  }

  if(!x.status){
   const s=x.situacao;

   if(s==='Pendente'||s==='pendente'){
    x.status='pendente';
   }else{
    x.status='pago';
   }
  }

  if(x.rep===undefined){
   x.rep=x.periodicidade||'unica';
  }

  if(x.fixa===undefined){
   x.fixa=false;
  }

  if(x.fixaId===undefined){
   x.fixaId=null;
  }

  if(!Array.isArray(x.excluidas)){
   x.excluidas=[];
  }

  if(x.excluirAPartir===undefined){
   x.excluirAPartir=null;
  }

  if(x.modeloFixa===undefined){
   x.modeloFixa=(
    x.rep!=='unica' &&
    !x.fixaId
   );
  }
 });

 db.u.forEach(x=>{

  if(!x.id)x.id=Date.now()+Math.random();

  if(!x.d)x.d=x.data||hoje();

  if(x.ganho===undefined){
   x.ganho=Number(x.ganhos||0);
  }

  if(x.despesa===undefined){
   x.despesa=Number(x.despesas||0);
  }

  if(x.combustivel===undefined){
   x.combustivel=Number(
    x['combustível']||x.combustivel||0
   );
  }

  if(x.km===undefined){
   x.km=Number(x.quilometros||0);
  }

  if(x.horas===undefined){
   x.horas=Number(x.horasTrabalhadas||0);
  }

  if(!x.cat){
   x.cat=x.categoria||'Uber/99';
  }
}

function addPessoal(){

 const data=document.getElementById('pData').value||hoje();
 const desc=document.getElementById('pDesc').value.trim();
 const valor=Number(document.getElementById('pValor').value||0);
 const tipo=document.getElementById('pTipo').value;
 const cat=document.getElementById('pCat').value;
 const pag=document.getElementById('pPag').value;
 const status=document.getElementById('pStatus').value;

 let rep=document.getElementById('pRep').value;

 const fixa=document.getElementById('pFixa').value==='sim';

 if(!desc||valor<=0){
  alert('Preencha a descrição e o valor.');
  return;
 }

 if(fixa && rep==='unica'){
  rep='mensal';
 }

 const id=Date.now()+Math.random();

 const item={
  id:id,
  d:data,
  desc:desc,
  v:valor,
  tipo:tipo,
  cat:cat,
  pag:pag,
  status:status,
  rep:rep,
  origem:'pessoal',
  fixa:fixa,
  modeloFixa:fixa,
  fixaId:fixa?id:null,
  excluidas:[],
  excluirAPartir:null
 };

 db.l.push(item);

 if(fixa && rep!=='unica'){
  gerarParaModelo(item);
 }

 salvar();

 document.getElementById('pDesc').value='';
 document.getElementById('pValor').value='';
 document.getElementById('pFixa').value='nao';
 document.getElementById('pRep').value='unica';

 render();
}

function proximaData(data,rep){

 const d=new Date(data+'T12:00:00');

 if(rep==='diaria'){
  d.setDate(d.getDate()+1);
 }

 if(rep==='semanal'){
  d.setDate(d.getDate()+7);
 }

 if(rep==='mensal'){
  d.setMonth(d.getMonth()+1);
 }

 return d.toISOString().slice(0,10);
}

function adicionarOcorrencia(modelo,data){

 modelo.excluidas=modelo.excluidas||[];

 if(modelo.excluidas.includes(data))return;

 if(modelo.excluirAPartir &&
    data>=modelo.excluirAPartir)return;

 const existe=db.l.some(x=>
  x.fixaId===modelo.id &&
  x.d===data
 );

 if(existe)return;

 db.l.push({
  id:Date.now()+Math.random(),
  d:data,
  desc:modelo.desc,
  v:modelo.v,
  tipo:modelo.tipo,
  cat:modelo.cat,
  pag:modelo.pag,
  status:'pendente',
  rep:modelo.rep,
  origem:'pessoal',
  fixa:true,
  modeloFixa:false,
  fixaId:modelo.id,
  excluidas:[],
  excluirAPartir:null
 });
}

function gerarParaModelo(modelo){

 let data=modelo.d;

 for(let i=0;i<12;i++){

  data=proximaData(data,modelo.rep);

  adicionarOcorrencia(modelo,data);
 }
}

function gerarRecorrencias(){

 const modelos=db.l.filter(x=>
  x.rep &&
  x.rep!=='unica' &&
  x.modeloFixa===true
 );

 modelos.forEach(modelo=>{

  let data=modelo.d;
  let limite=0;

  while(data<=hoje() && limite<500){

   data=proximaData(data,modelo.rep);

   if(data<=hoje()){
    adicionarOcorrencia(modelo,data);
   }

   limite++;
  }

  let ultima=data;

  for(let i=0;i<12;i++){
   ultima=proximaData(ultima,modelo.rep);
   adicionarOcorrencia(modelo,ultima);
  }
 });
}

function excluirPessoal(id){

 const item=db.l.find(x=>x.id==id);

 if(!item)return;

 const recorrente=
  item.rep &&
  item.rep!=='unica';

 if(recorrente || item.fixaId){

  const grupo=item.fixaId||item.id;

  const modelo=db.l.find(x=>
   x.id===grupo &&
   x.modeloFixa===true
  );

  const escolha=prompt(
   'Excluir despesa recorrente:\\n\\n'+
   '1 - Somente este lançamento\\n'+
   '2 - Este e os próximos\\n'+
   '3 - Todos os lançamentos\\n\\n'+
   'Digite 1, 2 ou 3.'
  );

  if(!['1','2','3'].includes(escolha)){
   return;
  }

  if(escolha==='1'){

   if(modelo && item.id===modelo.id){
    alert(
     'Esse é o lançamento principal. '+
     'Use uma das ocorrências abaixo para excluir somente uma ocorrência.'
    );
    return;
   }

   if(modelo){

    modelo.excluidas=modelo.excluidas||[];

    if(!modelo.excluidas.includes(item.d)){
     modelo.excluidas.push(item.d);
    }
   }

   db.l=db.l.filter(x=>x.id!==id);

  }else if(escolha==='2'){

   if(modelo){
    modelo.excluirAPartir=item.d;
   }

   db.l=db.l.filter(x=>{

    if(x.id===modelo?.id){
     return true;
    }

    if(x.fixaId===grupo &&
       x.d>=item.d){
     return false;
    }

    return x.id!==id;
   });

  }else{

   db.l=db.l.filter(x=>
    x.id!==grupo &&
    x.fixaId!==grupo
   );
  }

 }else{

  if(!confirm('Excluir este lançamento?')){
   return;
  }

  db.l=db.l.filter(x=>x.id!==id);
 }

 salvar();
 render();
}

function excluirFixa(id){

 if(!confirm(
  'Excluir esta despesa fixa e todas as suas ocorrências?'
 )){
  return;
 }

 db.l=db.l.filter(x=>
  x.id!==id &&
  x.fixaId!==id
 );

 salvar();
 render();
}

function alterarStatus(id){

 const item=db.l.find(x=>x.id==id);

 if(!item)return;

 item.status=
  item.status==='pago'
   ?'pendente'
   :'pago';

 salvar();
 render();
}

function alterarPagamento(id){

 const item=db.l.find(x=>x.id==id);

 if(!item)return;

 const novo=prompt(
  'Forma de pagamento:\\n\\n'+
  '1 - PIX\\n'+
  '2 - Dinheiro\\n'+
  '3 - Cartão'
 );

 if(novo==='1')item.pag='pix';
 else if(novo==='2')item.pag='dinheiro';
 else if(novo==='3')item.pag='cartao';
 else return;

 salvar();
 render();
}

function addUber(){

 const data=document.getElementById('uData').value||hoje();
 const ganho=Number(document.getElementById('uGanho').value||0);
 const despesa=Number(document.getElementById('uDespesa').value||0);
 const combustivel=Number(document.getElementById('uCombustivel').value||0);
 const km=Number(document.getElementById('uKm').value||0);
 const horas=Number(document.getElementById('uHoras').value||0);
 const cat=document.getElementById('uCat').value;

 if(ganho<=0){
  alert('Informe o ganho.');
  return;
 }

 db.u.push({
  id:Date.now()+Math.random(),
  d:data,
  ganho:ganho,
  despesa:despesa,
  combustivel:combustivel,
  km:km,
  horas:horas,
  cat:cat
 });

 salvar();

 document.getElementById('uGanho').value='';
 document.getElementById('uDespesa').value='';
 document.getElementById('uCombustivel').value='';
 document.getElementById('uKm').value='';
 document.getElementById('uHoras').value='';

 render();
}

function excluirUber(id){

 if(!confirm('Excluir este lançamento Uber/99?')){
  return;
 }

 db.u=db.u.filter(x=>x.id!==id);

 salvar();
 render();
}

function excluirCartao(id){

 if(!confirm('Excluir esta compra do cartão?')){
  return;
 }

 db.l=db.l.filter(x=>x.id!==id);

 salvar();
 render();
}

function salvarConfigCartao(){

 db.config.fechamento=
  Number(document.getElementById('fechamento').value)||5;

 db.config.vencimento=
  Number(document.getElementById('vencimento').value)||10;

 salvar();

 alert('Configuração salva.');

 render();
}

function nomePagamento(p){

 if(p==='pix')return'PIX';
 if(p==='cartao')return'Cartão';

 return'Dinheiro';
}

function dataBR(d){

 if(!d)return'';

 const p=d.split('-');

 if(p.length!==3)return d;

 return p[2]+'/'+p[1]+'/'+p[0];
}

function valorLancamento(x){
 return Number(x.v||x.valor||0);
}

function dinheiroBR(v){

 return Number(v||0).toLocaleString(
  'pt-BR',
  {
   style:'currency',
   currency:'BRL'
  }
 );
}

function escapeHTML(v){

 return String(v??'')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');
}
  function periodoAtual(){

 const agora=new Date();

 const inicio=new Date(
  agora.getFullYear(),
  agora.getMonth(),
  1
 );

 const fim=new Date(
  agora.getFullYear(),
  agora.getMonth()+1,
  1
 );

 return{
  inicio:inicio.toISOString().slice(0,10),
  fim:fim.toISOString().slice(0,10)
 };
}

function render(){

 gerarRecorrencias();

 renderDashboard();
 renderPessoal();
 renderFixas();
 renderSaldos();
 renderCartao();
 renderUber();
 renderRelatorios();
}

function renderDashboard(){

 const hojeData=hoje();

 let ganhos=0;
 let despesas=0;

 db.l.forEach(x=>{

  if(x.d!==hojeData)return;

  const v=valorLancamento(x);

  if(x.tipo==='receita'){
   ganhos+=v;
  }else{
   despesas+=v;
  }
 });

 db.u.forEach(x=>{

  if(x.d!==hojeData)return;

  ganhos+=Number(x.ganho||0);

  despesas+=
   Number(x.despesa||0)+
   Number(x.combustivel||0);
 });

 const lucro=ganhos-despesas;

 /*
  Reserva:
  ganhos - (despesas + combustível)
  */
 const combustivelHoje=db.u
  .filter(x=>x.d===hojeData)
  .reduce((s,x)=>s+Number(x.combustivel||0),0);

 const combustivelPessoal=db.l
  .filter(x=>
   x.d===hojeData &&
   x.cat==='Combustível'
  )
  .reduce((s,x)=>s+valorLancamento(x),0);

 const reservaBase=
  ganhos-
  (
   despesas+
   combustivelHoje+
   combustivelPessoal
  );

 const reserva=Math.max(0,reservaBase*0.10);

 document.getElementById('dGanhos').textContent=
  dinheiroBR(ganhos);

 document.getElementById('dDespesas').textContent=
  dinheiroBR(despesas);

 document.getElementById('dLucro').textContent=
  dinheiroBR(lucro);

 document.getElementById('dReserva').textContent=
  dinheiroBR(reserva);

 document.getElementById('dashboardResumo').innerHTML=`
  <p><strong>Hoje:</strong> ${dataBR(hojeData)}</p>
  <p>
   Ganhos: <strong>${dinheiroBR(ganhos)}</strong><br>
   Despesas: <strong>${dinheiroBR(despesas)}</strong><br>
   Lucro: <strong>${dinheiroBR(lucro)}</strong>
  </p>
 `;
}

function renderPessoal(){

 const el=document.getElementById('listaPessoal');

 const lista=db.l
  .filter(x=>!x.modeloFixa)
  .sort((a,b)=>b.d.localeCompare(a.d));

 if(!lista.length){

  el.innerHTML=
   '<div class="vazio">Nenhum lançamento pessoal.</div>';

  return;
 }

 el.innerHTML=lista.map(x=>{

  const valor=valorLancamento(x);

  const classe=
   x.tipo==='receita'
    ?'receita'
    :'despesa';

  const fixa=x.fixaId
   ?'<span class="tag">FIXA</span>'
   :'';

  const repeticao=
   x.rep&&x.rep!=='unica'
    ?' • '+x.rep
    :'';

  return`
   <div class="item">

    <div>
     <strong>
      ${escapeHTML(x.desc||'Sem descrição')}
     </strong>
     ${fixa}

     <br>

     <small class="muted">
      ${dataBR(x.d)}
      • ${escapeHTML(x.cat||'Despesas')}
      ${repeticao}
      • ${nomePagamento(x.pag)}
     </small>
    </div>

    <div style="text-align:right">

     <strong class="${classe}">
      ${dinheiroBR(valor)}
     </strong>

     <br>

     <button
      class="${x.status==='pago'?'ok':'sec'}"
      onclick="alterarStatus(${x.id})">
      ${x.status==='pago'?'Pago':'Pendente'}
     </button>

     <button
      class="sec"
      onclick="alterarPagamento(${x.id})">
      Pagamento
     </button>

     <button
      class="danger"
      onclick="excluirPessoal(${x.id})">
      Excluir
     </button>

    </div>

   </div>
  `;

 }).join('');
}

function renderRelatorios(){

 const el=document.getElementById('relatorio');

 const periodo=periodoAtual();

 let ganhos=0;
 let despesas=0;
 let combustivel=0;
 let km=0;
 let horas=0;

 db.l.forEach(x=>{

  if(x.d<periodo.inicio||x.d>=periodo.fim){
   return;
  }

  const v=valorLancamento(x);

  if(x.tipo==='receita'){
   ganhos+=v;
  }else{
   despesas+=v;

   if(x.cat==='Combustível'){
    combustivel+=v;
   }
  }
 });

 db.u.forEach(x=>{

  if(x.d<periodo.inicio||x.d>=periodo.fim){
   return;
  }

  ganhos+=Number(x.ganho||0);

  despesas+=Number(x.despesa||0);

  combustivel+=Number(x.combustivel||0);

  km+=Number(x.km||0);

  horas+=Number(x.horas||0);
 });

 const lucro=ganhos-despesas;

 const baseReserva=
  ganhos-(despesas+combustivel);

 const reserva=
  Math.max(0,baseReserva*0.10);

 const lucroReal=
  ganhos-despesas-combustivel;

 const custoKm=
  km>0
   ?(despesas+combustivel)/km
   :0;

 const lucroHora=
  horas>0
   ?lucroReal/horas
   :0;

 el.innerHTML=`

  <div class="cards">

   <div class="card">
    <small>Ganhos</small>
    <strong>${dinheiroBR(ganhos)}</strong>
   </div>

   <div class="card">
    <small>Despesas</small>
    <strong>${dinheiroBR(despesas)}</strong>
   </div>

   <div class="card">
    <small>Combustível</small>
    <strong>${dinheiroBR(combustivel)}</strong>
   </div>

   <div class="card">
    <small>Lucro</small>
    <strong>${dinheiroBR(lucro)}</strong>
   </div>

   <div class="card">
    <small>Reserva 10%</small>
    <strong>${dinheiroBR(reserva)}</strong>
   </div>

   <div class="card">
    <small>Lucro real</small>
    <strong>${dinheiroBR(lucroReal)}</strong>
   </div>

   <div class="card">
    <small>Custo por KM</small>
    <strong>${dinheiroBR(custoKm)}</strong>
   </div>

   <div class="card">
    <small>Lucro por hora</small>
    <strong>${dinheiroBR(lucroHora)}</strong>
   </div>

  </div>

  <div class="card">

   <strong>Período:</strong>
   ${dataBR(periodo.inicio)}
   até
   ${dataBR(
    new Date(
     new Date(periodo.fim+'T12:00:00').getTime()-86400000
    ).toISOString().slice(0,10)
   )}

   <br><br>

   <strong>KM:</strong>
   ${km.toLocaleString('pt-BR')}

   <br>

   <strong>Horas:</strong>
   ${horas}

  </div>
 `;
}

 carregar();

 }

 }

 if(fechamento){
  fechamento.value=db.config.fechamento||5;
 }

 const vencimento=document.getElementById('vencimento');

 if(vencimento){
  vencimento.value=db.config.vencimento||10;
 }

 /*

  os dados existentes são preservados.
  Apenas campos antigos são normalizados.

 salvar();

 render();

 aba('dashboard');
}
