<section id="backup" class="oculto">
<h2>Backup dos dados</h2>
<p>Exporte seus lançamentos, cartões e faturas para guardar uma cópia de segurança.</p>
<div class="acoes">
<button onclick="exportarBackup()">Exportar backup</button>
<button class="secundario" onclick="document.getElementById('arquivoBackup').click()">Importar backup</button>
</div>
<input id="arquivoBackup" type="file" accept=".json,application/json" class="oculto" onchange="importarBackup(event)">
<p class="pequeno">Guarde o arquivo exportado em um local seguro. A importação pode substituir os dados atuais.</p>
</section>

<section id="compras" class="oculto">
<h2>Compra no cartão</h2>
<label>Cartão</label>
<select id="cartaoCompra"></select>
<label>Descrição da compra</label>
<input id="descricaoCompra" placeholder="Ex.: eletrodoméstico">
<div class="linha">
<div>
<label>Valor total (R$)</label>
<input id="valorCompra" type="number" min="0.01" step="0.01">
</div>
<div>
<label>Data da compra</label>
<input id="dataCompra" type="date">
</div>
</div>
<label>Número de parcelas</label>
<select id="parcelasCompra">
<option value="1">1 parcela</option>
<option value="2">2 parcelas</option>
<option value="3">3 parcelas</option>
<option value="4">4 parcelas</option>
<option value="5">5 parcelas</option>
<option value="6">6 parcelas</option>
<option value="10">10 parcelas</option>
<option value="12">12 parcelas</option>
<option value="18">18 parcelas</option>
<option value="24">24 parcelas</option>
</select>
<div class="acoes">
<button onclick="salvarCompra()">Salvar compra</button>
<button class="secundario" onclick="mostrarAba('cartoes')">Voltar aos cartões</button>
</div>
</section>

<section id="faturas" class="oculto">
<h2>Faturas do cartão</h2>
<label>Selecionar cartão</label>
<select id="cartaoFatura" onchange="renderizarFatura()"></select>
<label>Mês da fatura</label>
<input id="mesFatura" type="month" onchange="renderizarFatura()">
<div id="conteudoFatura"></div>
</section>

<script>
const CHAVE_DADOS="meuFinanceiroPro2_dados";
const CHAVE_CARTOES="meuFinanceiroPro2_cartoes";
const CHAVE_FATURAS="meuFinanceiroPro2_faturas";

let lancamentos=JSON.parse(localStorage.getItem(CHAVE_DADOS)||"[]");
let cartoes=JSON.parse(localStorage.getItem(CHAVE_CARTOES)||"[]");
let faturasPagas=JSON.parse(localStorage.getItem(CHAVE_FATURAS)||"{}");

function salvarDados(){
 localStorage.setItem(CHAVE_DADOS,JSON.stringify(lancamentos));
 localStorage.setItem(CHAVE_CARTOES,JSON.stringify(cartoes));
 localStorage.setItem(CHAVE_FATURAS,JSON.stringify(faturasPagas));
}

function dinheiro(valor){
 return Number(valor||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function dataHoje(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function mostrarAba(id){
 document.querySelectorAll("main section").forEach(s=>s.classList.add("oculto"));
 const sec=document.getElementById(id);
 if(sec)sec.classList.remove("oculto");
 if(id==="inicio")atualizarResumo();
 if(id==="lancamentos")renderizarLancamentos();
 if(id==="cartoes"){renderizarCartoes();atualizarSeletoresCartao();}
 if(id==="compras"){atualizarSeletoresCartao();document.getElementById("dataCompra").value=dataHoje();}
 if(id==="faturas"){atualizarSeletoresCartao();renderizarFatura();}
}

function limparFormulario(){
 document.getElementById("descricao").value="";
 document.getElementById("valor").value="";
 document.getElementById("data").value=dataHoje();
 document.getElementById("tipo").value="entrada";
 document.getElementById("area").value="pessoal";
 document.getElementById("categoria").value="Outros";
 document.getElementById("repeticao").value="nao";
 document.getElementById("fixa").checked=false;
}

function salvarLancamento(){
 const tipo=document.getElementById("tipo").value;
 const area=document.getElementById("area").value;
 const descricao=document.getElementById("descricao").value.trim();
 const valor=Number(document.getElementById("valor").value);
 const data=document.getElementById("data").value;
 const categoria=document.getElementById("categoria").value;
 const repeticao=document.getElementById("repeticao").value;
 const fixa=document.getElementById("fixa").checked;

 if(!descricao||!Number.isFinite(valor)||valor<=0||!data){
  alert("Preencha descrição, valor e data corretamente.");
  return;
 }

 const quantidade=tipo==="despesa"?(repeticao==="diaria"?30:repeticao==="semanal"?4:repeticao==="mensal"?12:1):1;

 for(let i=0;i<quantidade;i++){
  const d=new Date(data+"T12:00:00");
  if(repeticao==="diaria")d.setDate(d.getDate()+i);
  if(repeticao==="semanal")d.setDate(d.getDate()+7*i);
  if(repeticao==="mensal"){
   const dia=d.getDate();
   d.setDate(1);
   d.setMonth(d.getMonth()+i);
   const ultimo=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
   d.setDate(Math.min(dia,ultimo));
  }
  lancamentos.push({
   id:String(Date.now())+"_"+i+"_"+Math.random().toString(36).slice(2,7),
   tipo:tipo,
   area:area,
   descricao:descricao,
   valor:Math.round(valor*100)/100,
   data:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
   categoria:categoria,
   fixa:tipo==="despesa"&&fixa
  });
 }

 salvarDados();
 limparFormulario();
 renderizarLancamentos();
 atualizarResumo();
 alert("Lançamento salvo com sucesso!");
}

function excluirLancamento(id){
 if(!confirm("Deseja excluir este lançamento?"))return;
 lancamentos=lancamentos.filter(x=>x.id!==id);
 salvarDados();
 renderizarLancamentos();
 atualizarResumo();
}

function renderizarLancamentos(){
 const lista=document.getElementById("listaLancamentos");
 if(!lancamentos.length){
  lista.innerHTML="<p>Nenhum lançamento registrado.</p>";
  return;
 }
 lista.innerHTML=lancamentos.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(x=>
  '<div class="item"><strong>'+escapar(x.descricao)+'</strong>'+
  '<div>'+escapar(x.data)+' · '+escapar(x.area.toUpperCase())+' · '+escapar(x.categoria)+'</div>'+
  '<div class="'+(x.tipo==="entrada"?"verde":"vermelho")+'">'+
  (x.tipo==="entrada"?"+":"−")+dinheiro(x.valor)+'</div>'+
  (x.fixa?'<div class="pequeno">Despesa fixa</div>':'')+
  '<button class="perigo" onclick="excluirLancamento('+JSON.stringify(x.id)+')">Excluir</button></div>'
 ).join("");
}

function atualizarResumo(){
 const entradas=lancamentos.filter(x=>x.tipo==="entrada").reduce((s,x)=>s+Number(x.valor),0);
 const despesas=lancamentos.filter(x=>x.tipo==="despesa").reduce((s,x)=>s+Number(x.valor),0);
 const saldo=entradas-despesas;
 const areas=["uber","99"];
 let reserva=0;
 areas.forEach(area=>{
  const e=lancamentos.filter(x=>x.area===area&&x.tipo==="entrada").reduce((s,x)=>s+Number(x.valor),0);
  const d=lancamentos.filter(x=>x.area===area&&x.tipo==="despesa").reduce((s,x)=>s+Number(x.valor),0);
  reserva+=Math.max(0,e-d)*0.10;
 });
 document.getElementById("totalEntradas").textContent=dinheiro(entradas);
 document.getElementById("totalDespesas").textContent=dinheiro(despesas);
 document.getElementById("saldoTotal").textContent=dinheiro(saldo);
 document.getElementById("reservaTotal").textContent=dinheiro(reserva);
 document.getElementById("resumoAreas").innerHTML=
  "<h3>Resultado por área</h3>"+
  ["pessoal","uber","99"].map(area=>{
   const e=lancamentos.filter(x=>x.area===area&&x.tipo==="entrada").reduce((s,x)=>s+Number(x.valor),0);
   const d=lancamentos.filter(x=>x.area===area&&x.tipo==="despesa").reduce((s,x)=>s+Number(x.valor),0);
   return '<div class="item"><strong>'+area.toUpperCase()+'</strong><div>Entradas: '+dinheiro(e)+'</div><div>Despesas: '+dinheiro(d)+'</div><div>Saldo: '+dinheiro(e-d)+'</div></div>';
  }).join("");
}

function escapar(valor){
 return String(valor??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function limparCartao(){
 document.getElementById("cartaoId").value="";
 document.getElementById("nomeCartao").value="";
 document.getElementById("limiteCartao").value="";
 document.getElementById("fechamentoCartao").value="20";
 document.getElementById("vencimentoCartao").value="5";
}

function salvarCartao(){
 const id=document.getElementById("cartaoId").value;
 const nome=document.getElementById("nomeCartao").value.trim();
 const limite=Number(document.getElementById("limiteCartao").value);
 const fechamento=Number(document.getElementById("fechamentoCartao").value);
 const vencimento=Number(document.getElementById("vencimentoCartao").value);

 if(!nome||!Number.isFinite(limite)||limite<0||
 fechamento<1||fechamento>31||vencimento<1||vencimento>31){
  alert("Confira o nome, limite e dias do cartão.");
  return;
 }

 const item={id:id||("cartao_"+Date.now()),nome,limite,fechamento,vencimento};
 const indice=cartoes.findIndex(c=>c.id===item.id);
 if(indice>=0)cartoes[indice]=item;
 else cartoes.push(item);

 salvarDados();
 limparCartao();
 renderizarCartoes();
 atualizarSeletoresCartao();
 alert("Cartão salvo com sucesso!");
}

function editarCartao(id){
 const c=cartoes.find(x=>x.id===id);
 if(!c)return;
 document.getElementById("cartaoId").value=c.id;
 document.getElementById("nomeCartao").value=c.nome;
 document.getElementById("limiteCartao").value=c.limite;
 document.getElementById("fechamentoCartao").value=c.fechamento;
 document.getElementById("vencimentoCartao").value=c.vencimento;
 window.scrollTo(0,0);
}

function excluirCartao(id){
 if(!confirm("Excluir este cartão? As compras já registradas não serão apagadas."))return;
 cartoes=cartoes.filter(c=>c.id!==id);
 salvarDados();
 renderizarCartoes();
 atualizarSeletoresCartao();
}

function renderizarCartoes(){
 const lista=document.getElementById("listaCartoes");
 if(!cartoes.length){
  lista.innerHTML="<p>Nenhum cartão cadastrado.</p>";
  return;
 }
 lista.innerHTML=cartoes.map(c=>{
  const usado=lancamentos.filter(x=>x.cartaoId===c.id&&x.tipo==="despesa").reduce((s,x)=>s+Number(x.valor),0);
  return '<div class="cartao"><h3>'+escapar(c.nome)+'</h3>'+
   '<div>Limite total: '+dinheiro(c.limite)+'</div>'+
   '<div>Compras registradas: '+dinheiro(usado)+'</div>'+
   '<div>Fechamento: dia '+c.fechamento+' · Vencimento: dia '+c.vencimento+'</div>'+
   '<div class="acoes"><button onclick="editarCartao('+JSON.stringify(c.id)+')">Editar</button>'+
   '<button onclick="abrirCompras('+JSON.stringify(c.id)+')">Nova compra</button>'+
   '<button class="perigo" onclick="excluirCartao('+JSON.stringify(c.id)+')">Excluir</button></div></div>';
 }).join("");
}

function atualizarSeletoresCartao(){
 ["cartaoCompra","cartaoFatura"].forEach(id=>{
  const select=document.getElementById(id);
  const anterior=select.value;
  select.innerHTML=cartoes.map(c=>'<option value="'+escapar(c.id)+'">'+escapar(c.nome)+'</option>').join("");
  if(cartoes.some(c=>c.id===anterior))select.value=anterior;
  if(!cartoes.length)select.innerHTML='<option value="">Cadastre um cartão primeiro</option>';
 });
}

function abrirCompras(id){
 mostrarAba("compras");
 document.getElementById("cartaoCompra").value=id;
 document.getElementById("dataCompra").value=dataHoje();
}
</script>

<script>
function salvarCompra(){
 const cartaoId=document.getElementById("cartaoCompra").value;
 const descricao=document.getElementById("descricaoCompra").value.trim();
 const valor=Number(document.getElementById("valorCompra").value);
 const data=document.getElementById("dataCompra").value;
 const parcelas=Number(document.getElementById("parcelasCompra").value);
 const cartao=cartoes.find(c=>c.id===cartaoId);

 if(!cartao){alert("Cadastre um cartão primeiro.");return;}
 if(!descricao||!Number.isFinite(valor)||valor<=0||!data||parcelas<1){
  alert("Preencha todos os dados da compra corretamente.");return;
 }

 const valorCentavos=Math.round(valor*100);
 const parcelaBase=Math.floor(valorCentavos/parcelas);
 const resto=valorCentavos-parcelaBase*parcelas;

 for(let i=0;i<parcelas;i++){
  const d=new Date(data+"T12:00:00");
  d.setMonth(d.getMonth()+i);
  const dia=d.getDate();
  d.setDate(1);
  const ultimo=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(dia,ultimo));

  let mes=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  const valorParcela=(parcelaBase+(i<resto?1:0))/100;

  lancamentos.push({
   id:"compra_"+Date.now()+"_"+i+"_"+Math.random().toString(36).slice(2,7),
   tipo:"despesa",
   area:"pessoal",
   descricao:descricao+" ("+(i+1)+"/"+parcelas+")",
   valor:valorParcela,
   data:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
   categoria:"Cartão de crédito",
   fixa:false,
   cartaoId:cartaoId,
   mesFatura:mes,
   compraParcelas:parcelas
  });
 }

 salvarDados();
 document.getElementById("descricaoCompra").value="";
 document.getElementById("valorCompra").value="";
 renderizarCartoes();
 atualizarResumo();
 alert("Compra registrada e dividida em "+parcelas+" parcela(s).");
 mostrarAba("faturas");
 document.getElementById("cartaoFatura").value=cartaoId;
 const primeira=lancamentos.find(x=>x.cartaoId===cartaoId&&x.data===data);
 if(primeira)document.getElementById("mesFatura").value=primeira.mesFatura;
 renderizarFatura();
}

function renderizarFatura(){
 const cartaoId=document.getElementById("cartaoFatura").value;
 const mes=document.getElementById("mesFatura").value;
 const area=document.getElementById("conteudoFatura");

 if(!cartaoId||!mes){
  area.innerHTML="<p>Selecione um cartão e o mês da fatura.</p>";
  return;
 }

 const itens=lancamentos.filter(x=>x.cartaoId===cartaoId&&x.mesFatura===mes);
 const total=itens.reduce((s,x)=>s+Number(x.valor),0);
 const paga=!!faturasPagas[cartaoId+"_"+mes];
 const cartao=cartoes.find(c=>c.id===cartaoId);

 area.innerHTML=
  '<div class="cartao"><h3>Fatura de '+escapar(mes)+'</h3>'+
  '<p>Cartão: '+escapar(cartao?cartao.nome:"")+'</p>'+
  '<div class="valor">'+dinheiro(total)+'</div>'+
  '<p>Status: <strong class="'+(paga?"verde":"vermelho")+'">'+(paga?"PAGA":"EM ABERTO")+'</strong></p>'+
  '<div class="acoes">'+
  '<button onclick="alternarFatura('+JSON.stringify(cartaoId)+','+JSON.stringify(mes)+')">'+(paga?"Reabrir fatura":"Marcar fatura como paga")+'</button>'+
  '</div><h3>Compras da fatura</h3>'+
  (itens.length?itens.map(x=>
   '<div class="item">'+escapar(x.descricao)+'<br>'+escapar(x.data)+'<br>'+dinheiro(x.valor)+
   '<br><button class="perigo" onclick="excluirCompra('+JSON.stringify(x.id)+')">Excluir parcela</button></div>'
  ).join(""):"<p>Nenhuma compra neste mês.</p>")+
  '<p class="pequeno">Marcar a fatura como paga não cria outra despesa, evitando contar a mesma compra duas vezes.</p></div>';
}

function alternarFatura(cartaoId,mes){
 const chave=cartaoId+"_"+mes;
 if(faturasPagas[chave]){
  if(!confirm("Deseja reabrir esta fatura?"))return;
  delete faturasPagas[chave];
 }else{
  if(!confirm("Confirmar que esta fatura foi paga?"))return;
  faturasPagas[chave]=true;
 }
 salvarDados();
 renderizarFatura();
}

function excluirCompra(id){
 if(!confirm("Excluir esta parcela da compra?"))return;
 lancamentos=lancamentos.filter(x=>x.id!==id);
 salvarDados();
 renderizarFatura();
 renderizarCartoes();
 atualizarResumo();
}

function exportarBackup(){
 const backup={
  versao:2,
  exportadoEm:new Date().toISOString(),
  lancamentos:lancamentos,
  cartoes:cartoes,
  faturasPagas:faturasPagas
 };
 const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="backup-financeiro-pro-2.json";
 document.body.appendChild(a);
 a.click();
 a.remove();
 URL.revokeObjectURL(url);
}

function importarBackup(event){
 const arquivo=event.target.files[0];
 if(!arquivo)return;
 const leitor=new FileReader();

 leitor.onload=function(){
  try{
   const b=JSON.parse(leitor.result);
   if(!b||!Array.isArray(b.lancamentos)||!Array.isArray(b.cartoes)||typeof b.faturasPagas!=="object"){
    throw new Error("Formato inválido");
   }
   if(!confirm("A importação substituirá os dados atuais. Deseja continuar?"))return;
   lancamentos=b.lancamentos;
   cartoes=b.cartoes;
   faturasPagas=b.faturasPagas||{};
   salvarDados();
   atualizarResumo();
   renderizarLancamentos();
   renderizarCartoes();
   atualizarSeletoresCartao();
   renderizarFatura();
   alert("Backup importado com sucesso!");
  }catch(e){
   alert("Não foi possível importar. Confira se selecionou um backup válido.");
  }finally{
   event.target.value="";
  }
 };
 leitor.readAsText(arquivo);
}

function iniciarAplicativo(){
 document.getElementById("data").value=dataHoje();
 document.getElementById("dataCompra").value=dataHoje();
 document.getElementById("mesFatura").value=dataHoje().slice(0,7);
 atualizarSeletoresCartao();
 atualizarResumo();
 renderizarLancamentos();
 renderizarCartoes();
 renderizarFatura();
 mostrarAba("inicio");
}

iniciarAplicativo();
</script>
</main>
