<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Financeiro</title>
<style>body{font-family:Arial;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:18px}main{max-width:1000px;margin:auto;padding:14px}.card{background:white;padding:14px;border-radius:14px;margin:10px 0;border:1px solid #ddd}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}input,select,button{padding:9px;border-radius:8px;border:1px solid #ccc}button{background:#2563eb;color:white;border:0;font-weight:bold}.danger{background:#dc2626}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left;font-size:12px}.table{overflow:auto}.muted{color:#6b7280}@media(max-width:700px){.grid,.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.form{grid-template-columns:1fr}}</style>
<header><h2>💰 Meu Financeiro</h2><div>Controle pessoal + Uber/99</div></header><main>
<div class="grid"><div class="card">Entradas<br><b id="e">R$ 0,00</b></div><div class="card">Despesas<br><b id="d">R$ 0,00</b></div><div class="card">Saldo<br><b id="s">R$ 0,00</b></div><div class="card">Reserva 10%<br><b id="r">R$ 0,00</b></div></div>
<div class="card"><h3>Lançamento pessoal</h3><div class="form"><input id="dt" type="date"><select id="tp"><option>Entrada</option><option>Despesa</option></select><select id="ca"><option>Salário</option><option>Uber / 99</option><option>Alimentação</option><option>Moradia</option><option>Contas</option><option>Carro</option><option>Cartão</option><option>Saúde</option><option>Lazer</option><option>Outros</option></select><input id="va" type="number" step=".01" placeholder="Valor"><input id="de" placeholder="Descrição"><button onclick="add()">Adicionar</button></div></div>
<div class="card"><h3>Uber / 99</h3><div class="form"><input id="ad" type="date"><input id="ag" type="number" step=".01" placeholder="Ganhos"><input id="ac" type="number" step=".01" placeholder="Despesas"><input id="af" type="number" step=".01" placeholder="Combustível"><input id="ak" type="number" step=".1" placeholder="KM"><input id="ah" type="number" step=".1" placeholder="Horas"><button onclick="adda()">Adicionar</button></div><p class="muted">Reserva automática: 10% dos ganhos.</p></div>
<div class="card"><h3>Lançamentos pessoais</h3><div class="table"><table><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Valor</th><th>Descrição</th><th></th></tr></thead><tbody id="tl"></tbody></table></div></div>
<div class="card"><h3>Lançamentos Uber / 99</h3><div class="table"><table><thead><tr><th>Data</th><th>Ganhos</th><th>Despesas</th><th>Comb.</th><th>KM</th><th>Horas</th><th>Reserva</th><th></th></tr></thead><tbody id="ta"></tbody></table></div></div>
</main><script>
let x=JSON.parse(localStorage.getItem('MF')||'{"l":[],"a":[]}');const $=i=>document.getElementById(i),n=i=>+$(i).value||0,m=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
function save(){localStorage.setItem('MF',JSON.stringify(x));render()}function add(){x.l.push({d:$('dt').value||new Date().toISOString().slice(0,10),t:$('tp').value,c:$('ca').value,v:n('va'),z:$('de').value});save()}function adda(){x.a.push({d:$('ad').value||new Date().toISOString().slice(0,10),g:n('ag'),c:n('ac'),f:n('af'),k:n('ak'),h:n('ah')});save()}function dl(q,i){x[q].splice(i,1);save()}function ed(q,i,v){x[q][i].d=v;save()}
function render(){let e=x.l.filter(a=>a.t==='Entrada').reduce((s,a)=>s+a.v,0)+x.a.reduce((s,a)=>s+a.g,0),d=x.l.filter(a=>a.t==='Despesa').reduce((s,a)=>s+a.v,0)+x.a.reduce((s,a)=>s+a.c+a.f,0);$('e').textContent=m(e);$('d').textContent=m(d);$('s').textContent=m(e-d);$('r').textContent=m(e*.1);
$('tl').innerHTML=x.l.map((a,i)=>`<tr><td><input type=date value="${a.d}" onchange="ed('l',${i},this.value)"></td><td>${a.t}</td><td>${a.c}</td><td>${m(a.v)}</td><td>${a.z||''}</td><td><button class=danger onclick="dl('l',${i})">×</button></td></tr>`).join('');
$('ta').innerHTML=x.a.map((a,i)=>`<tr><td><input type=date value="${a.d}" onchange="ed('a',${i},this.value)"></td><td>${m(a.g)}</td><td>${m(a.c)}</td><td>${m(a.f)}</td><td>${a.k}</td><td>${a.h}</td><td>${m(a.g*.1)}</td><td><button class=danger onclick="dl('a',${i})">×</button></td></tr>`).join('')}render()
</script></html>
